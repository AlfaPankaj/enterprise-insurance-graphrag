# GraphRAG Insurance Claims System — CI (Phase 5)
# Every push/PR: install deps, spin up a real Neo4j, seed the demo graph,
# run the full test suite + a backup smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/graphrag-demo
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
          --health-start-period 20s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphrag-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed demo graph
        run: python scripts/seed_graph.py --reset --apply-schema

      - name: Run test suite
        run: python -m pytest

      - name: Backup smoke test (cypher export)
        run: python scripts/backup_neo4j.py --out /tmp/backups

      - name: API smoke test (liveness + auth behavior)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from fastapi.testclient import TestClient
          from graphrag.api_server import app
          with TestClient(app) as c:
              assert c.get("/health/live").status_code == 200
              r = c.get("/api/v1/metrics")
              assert r.status_code == 200, r.text
          print("API smoke test OK")
          EOF
